name: searchcom
description: Application Objets perdus & retrouvés
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.2
  shared_preferences_web: ^2.2.4
  google_fonts: ^8.0.2
  emoji_picker_flutter: ^1.6.3
  image_picker: ^1.0.7
  file_picker: ^6.1.1
  http: ^1.2.2
  jwt_decoder: ^2.0.1
  url_launcher: ^6.2.6
  share_plus: ^7.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/splash.png
    - assets/lang/fr.json
    - assets/lang/en.json
    - assets/lang/ar.json
